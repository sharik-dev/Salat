name: Salat
options:
  bundleIdPrefix: com.salat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: "2XR666D9B2"
    CODE_SIGN_STYLE: Automatic
    # iPhone seul. L'app est verrouillée en portrait et dessinée pour le pouce ;
    # sur un iPad 13" la même mise en page s'étirerait sans rien gagner — et
    # déclarer la famille 2 obligerait à livrer un jeu de captures 2048 × 2732
    # d'écrans qui n'ont jamais été pensés pour cette taille.
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "5"

targets:
  Salat:
    type: application
    platform: iOS
    sources:
      - path: Salat
      - path: SalatKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salat
        # Répété ici : XcodeGen écrit « 1,2 » au niveau de la cible, qui écrase
        # le réglage projet — c'est ce doublon silencieux qui a fait réclamer
        # des captures iPad à la soumission (SCREENSHOT_REQUIRED.IPAD_PRO).
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Portrait seul n'est accepté par la validation ASC (erreur 90474)
        # qu'accompagné de plein écran : sans lui, Apple exige les quatre
        # orientations pour le multitâche iPad, même sur une app iPhone.
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_CFBundleDisplayName: Salat
        # Asked only when the record button is first pressed, never at launch.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "To record you reciting a step, so you can play it back against the reciter. Recordings stay on this iPhone."
        # On-device only (the recognizer is created with
        # requiresOnDeviceRecognition): the words highlighted while you recite
        # never leave the phone, which is what the privacy page promises.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "To light up each word as you recite it, like a karaoke line. Recognition runs on this iPhone only; nothing is sent anywhere."
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        # Sans cette clé, chaque build monte en MISSING_EXPORT_COMPLIANCE et
        # aucun testeur TestFlight n'est prévenu tant qu'on n'a pas répondu
        # à la main. L'app ne chiffre rien : pas de réseau, pas de crypto.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: '"Salat/Preview Content"'
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: Salat/Salat.entitlements
        # AdMob : l'ID d'app et SKAdNetwork ne sont pas des clés INFOPLIST_KEY_,
        # ils vivent dans ce plist partiel, fusionné avec le plist généré.
        INFOPLIST_FILE: Salat/Info.plist
        INFOPLIST_KEY_NSUserTrackingUsageDescription: "Your data is used to show you more relevant ads. Ads keep Salat free."
    # Pubs AdMob (Services/Ads.swift) : une interstitielle toutes les deux pauses.
    dependencies:
      - target: SalatWidgetExtension
        embed: true
      - package: GoogleMobileAds
      - package: UserMessagingPlatform
        product: GoogleUserMessagingPlatform

  SalatWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SalatWidget
      - path: SalatKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salat.widget
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: SalatWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: SalatWidget/SalatWidget.entitlements
        ENABLE_PREVIEWS: YES

  SalatTests:
    type: bundle.unit-test
    platform: iOS
    # Hosted by the app rather than compiling SalatKit a second time: that way
    # `@testable import Salat` links, and the tests read the very same resource
    # bundle the app ships.
    sources:
      - path: SalatTests
    dependencies:
      - target: Salat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salat.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Salat.app/Salat"
        BUNDLE_LOADER: "$(TEST_HOST)"

  SalatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SalatUITests
    dependencies:
      - target: Salat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salat.uitests
        TEST_TARGET_NAME: Salat

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.11.0
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0

schemes:
  Salat:
    build:
      targets:
        Salat: all
        SalatTests: [test]
        SalatUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SalatTests, SalatUITests]

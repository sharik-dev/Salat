name: Salat
options:
  bundleIdPrefix: com.salat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Salat:
    type: application
    platform: iOS
    sources:
      - path: Salat
      - path: SalatKit
    dependencies:
      - target: SalatWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Salat
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: '"Salat/Preview Content"'
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: Salat/Salat.entitlements

  SalatWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SalatWidget
      - path: SalatKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salat.widget
        INFOPLIST_FILE: SalatWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: SalatWidget/SalatWidget.entitlements
        ENABLE_PREVIEWS: YES

  SalatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SalatTests
      - path: SalatKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salat.tests

schemes:
  Salat:
    build:
      targets:
        Salat: all
        SalatTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SalatTests]

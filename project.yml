name: Salat
options:
  bundleIdPrefix: com.salat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: "2XR666D9B2"
    CODE_SIGN_STYLE: Automatic
    # iPhone seul. L'app est verrouillée en portrait et dessinée pour le pouce ;
    # sur un iPad 13" la même mise en page s'étirerait sans rien gagner — et
    # déclarer la famille 2 obligerait à livrer un jeu de captures 2048 × 2732
    # d'écrans qui n'ont jamais été pensés pour cette taille.
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Salat:
    type: application
    platform: iOS
    sources:
      - path: Salat
      - path: SalatKit
    dependencies:
      - target: SalatWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Salat
        # Asked only when the record button is first pressed, never at launch.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "To record you reciting a step, so you can play it back against the reciter. Recordings stay on this iPhone."
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: '"Salat/Preview Content"'
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: Salat/Salat.entitlements

  SalatWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SalatWidget
      - path: SalatKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salat.widget
        INFOPLIST_FILE: SalatWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: SalatWidget/SalatWidget.entitlements
        ENABLE_PREVIEWS: YES

  SalatTests:
    type: bundle.unit-test
    platform: iOS
    # Hosted by the app rather than compiling SalatKit a second time: that way
    # `@testable import Salat` links, and the tests read the very same resource
    # bundle the app ships.
    sources:
      - path: SalatTests
    dependencies:
      - target: Salat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salat.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Salat.app/Salat"
        BUNDLE_LOADER: "$(TEST_HOST)"

  SalatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SalatUITests
    dependencies:
      - target: Salat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salat.uitests
        TEST_TARGET_NAME: Salat

schemes:
  Salat:
    build:
      targets:
        Salat: all
        SalatTests: [test]
        SalatUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SalatTests, SalatUITests]
